[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ns-agent-reliability"
version = "0.2.0a5"
description = "OpenSynapse: bounded, verifiable AI work infrastructure for machines you own, with reliability diagnostics"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
authors = [{name = "NS project contributors"}]
keywords = ["opensynapse", "mcp", "chatgpt", "server", "android", "termux", "agent", "self-hosted", "reliability"]

[project.optional-dependencies]
http = ["fastmcp>=4.0.3,<5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fastmcp>=4.0.3,<5"]

[project.scripts]
opensynapse = "opensynapse.cli:main"
ns-reliability = "ns_agent_reliability.doctor:main"
ns-direct-channel = "ns_direct_channel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
